plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
}

group = mod_group_id
version = mod_version

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            // 本家与 l2library 都带 mixin，而它们的 refmap 里存的是 SRG 名。
            // 开发环境跑的是 official 名，不告诉 Mixin 去哪张表做映射的话，
            // 依赖里的 mixin 会报 "target not found"（l2library 的 EntityMixin 就是第一个撞上的）。
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }
        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }
        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }
        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    mavenLocal() // 重要：供本地发布测试使用
    maven { url 'https://maven.minecraftforge.net' }
    maven { url 'https://maven.tterrag.com/' }
    maven { url 'https://maven.blamejared.com' }
    maven { url "https://maven.shadowsoffire.dev/releases" }
    // 本家与 l2 系列是放在 libs/ 里的成品 jar，flatDir 直接吃（fg.deobf 负责重映射）。
    flatDir { dirs 'libs' }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // 傀儡装配（本家）：龙是它的一个 GolemType，实体 / 部件 / 渲染 / AI 全走它的框架。
    implementation fg.deobf("dev.xkmc.modulargolems:modulargolems:${modulargolems_version}")
    // 注册（L2Registrate）、实体序列化（l2serial，本家用它存取整个实体）、界面布局（MenuLayoutConfig）。
    // 其余同族库是本家/l2library 编译时要用到的，缺一个就会报找不到符号。
    implementation fg.deobf("dev.xkmc.l2library:l2library:${l2library_version}-slim")
    implementation fg.deobf("dev.xkmc.l2serial:l2serial:1.2.2")
    implementation fg.deobf("dev.xkmc.l2screentracker:l2screentracker:0.1.4")
    implementation fg.deobf("dev.xkmc.l2tabs:l2tabs:0.3.3")
    implementation fg.deobf("dev.xkmc.l2itemselector:l2itemselector:0.1.9")
    implementation fg.deobf("dev.xkmc.l2damagetracker:l2damagetracker:0.3.7")
    implementation fg.deobf("dev.xkmc.l2modularblock:l2modularblock:1.1.0")
    implementation fg.deobf("dev.xkmc.mob_weapon_api:mob_weapon_api:0.2.14")
    implementation fg.deobf("com.tterrag.registrate:Registrate:${registrate_version}")

    // JEI 只用来编译那个说明页插件，运行时装不装都行——插件类只会被 JEI 自己扫描、加载。
    compileOnly fg.deobf(files("libs/jei-1.20.1-forge-15.20.0.130.jar"))
}

tasks.named('processResources', ProcessResources).configure {
    filteringCharset = 'UTF-8'
    var replaceProperties = [
            minecraft_version: minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version: forge_version,
            forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id,
            mod_name: mod_name,
            mod_license: mod_license,
            mod_version: mod_version,
            mod_authors: mod_authors,
            mod_description: mod_description
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                "Specification-Title"     : mod_id,
                "Specification-Vendor"    : mod_authors,
                "Specification-Version"   : "1",
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : project.jar.archiveVersion,
                "Implementation-Vendor"   : mod_authors,
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                // Mixin 靠自己这份清单被加载；mods.toml 里的 mixinConfigs 是对应的另一处声明
                "MixinConfigs"            : "${mod_id}.mixins.json"
        ])
    }
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
